name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          if jq -e --arg tag "v$version" 'any(.[]; .tag_name == $tag)' releases.json >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: version
    if: needs.version.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: tenki-standard-large-plus-16c-32g
          - target: aarch64-apple-darwin
            runner: tenki-macos-15-medium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GROK_VERSION: ${{ needs.version.outputs.version }}
      GROK_DISABLE_AUTOUPDATER: "1"
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config libasound2-dev libudev-dev cmake clang
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - run: cargo install dotslash --version 0.5.7 --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: cargo build --locked --profile release-dist --features release-dist -p xai-grok-pager-bin --target ${{ matrix.target }}
      - name: Check binary version
        run: target/${{ matrix.target }}/release-dist/xai-grok-pager --version | grep -F "$GROK_VERSION"
      - name: Package binary and launcher
        run: bun run release:package ${{ matrix.target }} target/${{ matrix.target }}/release-dist/xai-grok-pager
      - uses: actions/upload-artifact@v4
        with:
          name: grok-build2-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [version, build]
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: grok-build2-*
          merge-multiple: true
          path: dist
      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')" = 2
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Grok Build 2 v$VERSION" --notes-file CHANGELOG.md
