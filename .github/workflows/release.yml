name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          if jq -e --arg tag "v$version" 'any(.[]; .tag_name == $tag)' releases.json >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: version
    if: needs.version.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
  build:
    needs: [version, test]
    runs-on: tenki-standard-large-plus-16c-32g
    timeout-minutes: 120
    env:
      GROK_VERSION: ${{ needs.version.outputs.version }}
      GROK_DISABLE_AUTOUPDATER: "1"
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config libasound2-dev libudev-dev cmake clang
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - run: cargo install dotslash --version 0.5.7 --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: cargo build --locked --profile release-dist --features release-dist -p xai-grok-pager-bin --target x86_64-unknown-linux-gnu
      - name: Check binary version
        run: target/x86_64-unknown-linux-gnu/release-dist/xai-grok-pager --version | grep -F "$GROK_VERSION"
      - name: Package binary and launcher
        run: bun run release:package x86_64-unknown-linux-gnu target/x86_64-unknown-linux-gnu/release-dist/xai-grok-pager
      - uses: actions/upload-artifact@v4
        with:
          name: grok-build2-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 14
